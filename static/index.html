<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist</title>
<link rel="stylesheet" href="/static/style.css?v=links-editor1">
<script src="/static/app.js?v=links-editor1" type="module"></script>
</head>
<body>
<main>
  <h1>Wishlist</h1>
  <p id="owner-name" class="owner-name"></p>
  <p id="notice" role="status" aria-live="polite"></p>
  <form id="composer" aria-label="Gift editor" hidden>
    <div class="composer-media">
      <label class="photo-field" title="Add photos">
        <input aria-label="Photo" name="image" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif">
        <span class="photo-plus" aria-hidden="true">+</span>
        <span class="photo-label">Add photos</span>
      </label>
      <div id="photo-previews" aria-label="Photo order" role="list"></div>
    </div>
    <div class="composer-content">
      <input aria-label="Title" name="title" placeholder="Title" required maxlength="120">
      <input aria-label="Price" name="price" placeholder="Price" maxlength="40">
      <textarea aria-label="Description" name="description" placeholder="Description" maxlength="400" rows="2"></textarea>
      <div class="composer-links"><div id="link-badges" aria-label="Added links"></div><input aria-label="Link" name="links" placeholder="Link" autocomplete="off" type="text"></div>
    </div>
    <div class="composer-actions"><button type="submit">Add</button><button id="cancel-edit" type="button" hidden>Cancel</button><button id="delete-item" class="danger" type="button" hidden>Delete gift</button></div>
    <p id="composer-error" role="alert"></p>
  </form>
  <p id="empty" role="status" hidden></p>
  <button id="retry" type="button" hidden>Try again</button>
  <section id="items" aria-label="Gifts"></section>
</main>
<div id="reserve" class="name-popover" role="dialog" aria-labelledby="reservation-heading" hidden>
  <form id="reserve-form">
    <label for="name" id="reservation-heading">Reserve gift</label>
    <div class="name-entry">
      <input id="name" name="name" placeholder="Name" maxlength="60" required autocomplete="off" aria-describedby="name-hint name-error">
      <button type="submit" aria-label="Confirm">↵</button>
    </div>
    <p id="name-hint" class="hint"></p>
    <p id="name-error" role="alert"></p>
  </form>
</div>
<div id="account-slot"><a class="account-link" id="account" href="/login">Sign in</a></div>
</body>
</html>
