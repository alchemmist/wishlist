          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Python syntax result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-python-syntax-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/python-syntax.json
