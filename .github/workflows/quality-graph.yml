      - name: Install pinned Quality Graph toolchain
        run: python -m pip install -r requirements-quality.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: "set -euo pipefail\nfind static tests/e2e -name '*.js' -print0 | while IFS= read -r -d '' file; do\n  node --input-type=module --check < \"$file\"\ndone\nnode --check playwright.config.js\n"
        shell: bash
        name: Run JavaScript syntax
        id: quality-command
        continue-on-error: true
      - name: Collect JavaScript syntax result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
