          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - graph
    timeout-minutes: 10
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-python@v5
