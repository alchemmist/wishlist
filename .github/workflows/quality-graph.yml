# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph:
    name: Quality Graph declaration and generated files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned Quality Graph toolchain
        run: python -m pip install -r requirements-quality.txt
      - run: qg validate
        name: Run Quality Graph declaration and generated files
        id: quality-command
        continue-on-error: true
      - name: Collect Quality Graph declaration and generated files result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
          operation: collect
          node-id: graph
          title: Quality Graph declaration and generated files
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 320d6b018b783d110da5c5ee0627a5498dca418d233222d521c33c846821629e
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Quality Graph declaration and generated files result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-graph-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Quality Graph declaration and generated files result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 10
  workflow-syntax:
    name: GitHub workflow syntax and expressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned Quality Graph toolchain
        run: python -m pip install -r requirements-quality.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: 'false'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck= -pyflakes=
        name: Run GitHub workflow syntax and expressions
        id: quality-command
        continue-on-error: true
      - name: Collect GitHub workflow syntax and expressions result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@3b0cf7d8a33215d5a3bb5521b4e0e41c18e8cb7c
        with:
          operation: collect
          node-id: workflow-syntax
          title: GitHub workflow syntax and expressions
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: 320d6b018b783d110da5c5ee0627a5498dca418d233222d521c33c846821629e
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload GitHub workflow syntax and expressions result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-workflow-syntax-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/workflow-syntax.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce GitHub workflow syntax and expressions result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - graph
    timeout-minutes: 10
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - uses: actions/setup-python@v5
