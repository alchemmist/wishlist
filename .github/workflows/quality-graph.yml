        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: 'set -euo pipefail

          mkdir -p reports

          cd services/image-optimizer

          npm ci

          npm audit --audit-level=low

          node --test --test-reporter=junit test.cjs > ../../reports/image-optimizer.xml

          '
        shell: bash
        name: Run Sharp/libvips lossless optimizer and dependency audit
