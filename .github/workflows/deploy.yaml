name: Wishlist release

# Quality Graph owns all checks. Only its successful, trusted main runs may deploy.
on:
  workflow_run:
    workflows: ["Quality Graph (push)", "Quality Graph"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
      && (
        (github.event.workflow_run.name == 'Quality Graph (push)' && github.event.workflow_run.event == 'push')
        || (github.event.workflow_run.name == 'Quality Graph' && github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wishlist-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run's github.sha is NOT necessarily the checked commit.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: "false"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: harbor.socrat.alchemmist.xyz
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/wishlist:${{ github.event.workflow_run.head_sha }}
      - name: Refuse to deploy a superseded commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (branch.commit.sha !== context.payload.workflow_run.head_sha) {
              core.setFailed('The checked commit is no longer main HEAD; wait for the latest Quality Graph run.');
            }
      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}
